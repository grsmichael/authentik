# authentik 本地开发服务导航（tools/nav）——容器化启动，方便调试。
#
# 用法：
#   docker compose -f tools/nav/docker-compose.yml up -d --build   # 首次或改了脚本后加 --build
#   docker compose -f tools/nav/docker-compose.yml down
#   docker compose -f tools/nav/docker-compose.yml logs -f
# 然后打开 http://localhost:8899/
#
# 本文件只管「导航页自己」。本项目的其余服务由 deploy/docker-compose.yml 起在容器里：
# authentik server（容器 authentik-server）对外发布 9000 / 9443，Postgres（容器
# authentik-postgresql）只在 compose 网络内、不映射宿主机端口。导航服务通过
# host.docker.internal 探测宿主机端口，所以能正确反映 9000 / 9443 的状态，并用
# docker.sock 读取上面两个容器的状态。
#
# 端口 8899 为默认；若被占用，启动时会报端口冲突，改成没被占用的即可（同时同步
# services.json 里「服务导航」那一项的 port，README 的端口表与起服务步骤）。

services:
  nav:
    build: .
    image: authentik-nav:latest
    container_name: authentik-nav
    ports:
      - "8899:8899"
    environment:
      NAV_PORT: "8899"   # 端口占用时改这里，并把 services.json 的 8899 一起改掉
      NAV_BIND: "0.0.0.0"
      # 容器内 127.0.0.1 是容器自己，必须指到宿主机，否则所有服务误报 down
      NAV_PROBE_HOST: host.docker.internal
      # 可选：显式指定宿主机内网 IP，用于页面「共享给其他设备」的分享地址。
      # 不填时脚本会自动解析 host.docker.internal，通常就够了。
      # NAV_HOST_IP: "192.168.1.100"
    volumes:
      # 只为让容器内 docker ps 能查到容器状态（仅展示用，不影响在线判定），只读挂载
      - /var/run/docker.sock:/var/run/docker.sock:ro
    extra_hosts:
      # Linux 上必须显式加这一条 host.docker.internal 才存在；
      # Docker Desktop 上 host-gateway 同样解析到宿主机，加了也无害，换机器不用改。
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8899/__services"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
