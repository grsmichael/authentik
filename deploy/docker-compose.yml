# authentik 本地部署栈（postgres + server + worker）
#
# 与仓库 lifecycle/container/compose.yml 同源（官方镜像标准栈）。
# 数据卷都落在 deploy/ 目录下（./data ./certs ./custom-templates），方便清理。
#
# 启动：
#   cd deploy
#   docker compose pull
#   docker compose up -d
#
# 服务导航（tools/nav，容器 authentik-nav，http://localhost:8899/）会探测
# 本栈对外发布的宿主机端口（9000/9443），并用 container_name 展示容器状态。
#
# 说明：
# - LDAP / RADIUS / Proxy / RAC 等 outpost 默认以「嵌入式」方式随 server 一起运行，
#   足以在 UI 里体验；如需独立的 outpost 容器再另行部署。
# - Postgres 仅映射宿主 127.0.0.1:5433（容器内固定 5432）。映射的目的：让「许可证管理控制台」
#   能用 psycopg2 直连本机 Postgres 写许可证 + 清缓存，不必依赖 docker exec。
#   5433 避让本机可能占用的 5432；仅绑 127.0.0.1，不暴露到局域网。
#   改端口后记得同步 tools/nav/services.json 与 tools/nav/README.md、以及控制台设置页默认值。
#   要连库调试也可 `docker exec -it authentik-postgresql psql -U authentik`。
# - 默认缓存/渠道走进程内存，未启用 Redis；如要启用，另行加 redis 服务并配置
#   AUTHENTIK_CACHE__URL / AUTHENTIK_CHANNEL__URL。

services:
  postgresql:
    container_name: authentik-postgresql
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${PG_DB:-authentik}
      POSTGRES_PASSWORD: ${PG_PASS:?database password required}
      POSTGRES_USER: ${PG_USER:-authentik}
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test:
        - CMD-SHELL
        - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      timeout: 5s
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    ports:
      # Q-10：本机直连通道用（控制台 psycopg2 写许可证 + 清缓存）。仅绑 127.0.0.1。
      - "127.0.0.1:5433:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  server:
    container_name: authentik-server
    command: server
    depends_on:
      postgresql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.11.0-rc1}
    ports:
      - ${COMPOSE_PORT_HTTP:-9000}:9000
      - ${COMPOSE_PORT_HTTPS:-9443}:9443
    restart: unless-stopped
    shm_size: 512mb
    volumes:
      - ./data:/data
      - ./custom-templates:/templates
      # 自签企业版许可证的信任锚：覆盖容器内的 Root CA 证书。
      # authentik 以相对路径 authenticik/enterprise/public.pem 读取它
      # （容器 CWD=/，绝对路径即 /authentik/enterprise/public.pem），
      # 这个文件是整个许可证校验体系唯一的信任锚。见 tools/enterprise-license/。
      - ./enterprise-pki/public.pem:/authentik/enterprise/public.pem:ro

  worker:
    container_name: authentik-worker
    command: worker
    depends_on:
      postgresql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.11.0-rc1}
    restart: unless-stopped
    shm_size: 512mb
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
      - ./certs:/certs
      - ./custom-templates:/templates
      # 与 server 同理：worker 也会读许可证（用量统计、企业版定时任务）
      - ./enterprise-pki/public.pem:/authentik/enterprise/public.pem:ro
